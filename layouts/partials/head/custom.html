{{- if .IsHome -}}
{{- $isEn := eq .Language.Lang "en" -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "@id": "https://notation.co.jp/#organization",
  "name": {{ if $isEn }}"Notation LLC"{{ else }}"合同会社ノーテーション"{{ end }},
  "alternateName": {{ if $isEn }}"合同会社ノーテーション"{{ else }}"Notation LLC"{{ end }},
  "url": "https://notation.co.jp/",
  "email": "mailto:info@notation.co.jp",
  "founder": { "@id": "https://orcid.org/0009-0005-2429-3279" },
  "employee": { "@id": "https://orcid.org/0009-0005-2429-3279" }
}
</script>
<link rel="alternate" hreflang="ja" href="https://notation.co.jp/">
<link rel="alternate" hreflang="en" href="https://notation.co.jp/en/">
<link rel="alternate" hreflang="x-default" href="https://notation.co.jp/">
{{- else if and (eq .Kind "page") (not .Date.IsZero) -}}
  {{ partial "schema-article.html" . }}
{{- end -}}

{{- if and (not .IsHome) .IsTranslated -}}
  {{- range .AllTranslations }}
<link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}">
  {{- end }}
{{- end -}}
